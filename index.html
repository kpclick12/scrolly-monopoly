<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="En visuell berättelse som jämför statistik om den svenska bostadsmarknaden med Monopol som berättargrepp: priser, boendeformer, skatter och skulder." />
    <!-- The address of record is plainx.dev, which serves this build at a clean
         path via a rewrite; GitHub Pages remains the standalone origin. The
         social image stays on that origin because its absolute URL resolves
         from both locations. -->
    <link rel="canonical" href="https://plainx.dev/posts/the-board-has-changed" />
    <title>Spelplanen har förändrats — svenska fastighetsmarknaden som Monopol</title>

    <!-- Open Graph. og:image must be an ABSOLUTE url — relative paths are
         ignored by most scrapers, which is the usual reason a link preview
         shows no picture. 1200x630 is the standard large-card size. -->
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:site_name" content="Spelplanen har förändrats" />
    <meta property="og:url" content="https://plainx.dev/posts/the-board-has-changed" />
    <meta property="og:title" content="Spelplanen har förändrats — svenska fastighetsmarknaden som Monopol" />
    <meta
      property="og:description"
      content="En visuell berättelse som jämför statistik om den svenska bostadsmarknaden med Monopol som berättargrepp: priser, boendeformer, skatter och skulder."
    />
    <meta property="og:image" content="https://kpclick12.github.io/scrolly-monopoly/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Ett Monopolbräde där gatornas färgfält har rest sig som höga torn — i höjd med dagens verkliga kvadratmeterpriser."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spelplanen har förändrats — svenska fastighetsmarknaden som Monopol" />
    <meta
      name="twitter:description"
      content="En visuell berättelse som jämför statistik om den svenska bostadsmarknaden med Monopol som berättargrepp."
    />
    <meta name="twitter:image" content="https://kpclick12.github.io/scrolly-monopoly/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Ett Monopolbräde där gatornas färgfält har rest sig som höga torn — i höjd med dagens verkliga kvadratmeterpriser."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
